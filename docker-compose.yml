# Local run of TokTickIT with Docker Compose (Lab 5, Student Guide Episode 3).
# The passwords below are fallbacks for your own computer only. Override them in a
# local .env next to this file; the cloud gets its values from Secret Manager.
# Local logins after `docker compose up --build -d`:
#   admin@toktickit.com      / ADMIN_PASSWORD     (default AdminInitial123!, must change at first login)
#   jennifer.anderson@...    / DEMO_USER_PASSWORD (default DemoInitial123!)
services:
  db:
    image: postgres:16-alpine
    container_name: toktickit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toktickit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toktickit}
      POSTGRES_DB: ${POSTGRES_DB:-toktickit}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toktickit} -d ${POSTGRES_DB:-toktickit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: toktickit-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-toktickit}:${POSTGRES_PASSWORD:-toktickit}@db:5432/${POSTGRES_DB:-toktickit}?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminInitial123!}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-DemoInitial123!}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command: ["sh", "-c", "npx prisma migrate deploy && npm run prisma:seed"]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: toktickit-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-toktickit}:${POSTGRES_PASSWORD:-toktickit}@db:5432/${POSTGRES_DB:-toktickit}?schema=public
      # Local-only fallback; the cloud reads JWT_SECRET from Secret Manager.
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-me}
    ports:
      - "3000:3000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: toktickit-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  postgres_data:
